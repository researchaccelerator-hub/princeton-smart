# Institution build identity. An institution's fork changes this file, the brand strings in
# app/src/main/res/values/brand.xml and the icon app/src/main/res/drawable/logo_just_square_small.png.
# See docs/institution-branding.md.
#
# applicationId: the app's identity on the phone and in Firebase. Choose it once: changing it
# later installs a separate app, and participants lose data that has not uploaded. The source
# package stays com.screenlake whatever this is. Debug builds add ".debug".
applicationId=com.screenlake
